# CatosTV live USB boot menu. build-iso.sh puts this in the
# ISO profile; mkarchiso fills in the %…% placeholders.
#
# Readable from the sofa: GRUB draws at 1280×720 and the TV scales it up,
# with a large font (themes/catostv). Each "Install" entry tells the
# installer which graphics drivers to set up (catostv.gpu=…).

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png

set gfxmode=1280x720,1024x768,auto
set gfxpayload=keep
terminal_input console
terminal_output gfxterm

set color_normal=light-gray/black
set menu_color_normal=light-gray/black
set menu_color_highlight=white/magenta
if [ -e /boot/grub/themes/catostv/theme.txt ]; then
    loadfont /boot/grub/themes/catostv/catostv-regular-32.pf2
    loadfont /boot/grub/themes/catostv/catostv-bold-32.pf2
    loadfont /boot/grub/themes/catostv/catostv-bold-56.pf2
    loadfont /boot/grub/themes/catostv/catostv-regular-22.pf2
    set theme=/boot/grub/themes/catostv/theme.txt
fi

set default=install
set timeout=10
set timeout_style=menu

set catostv_linux="/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux"
set catostv_initrd="/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img"
# The tuning parameters are the ones in target-root/usr/share/catostv/kernel-params
# that also make sense for the installer (a test keeps them in sync).
set catostv_params="archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash loglevel=3 rd.udev.log_level=3 nowatchdog preempt=full amd_pstate=active vt.global_cursor_default=0"

menuentry "Install CatosTV" --id install {
    linux $catostv_linux $catostv_params catostv.gpu=auto
    initrd $catostv_initrd
}

menuentry "Install with NVIDIA's driver" --id install-nvidia {
    linux $catostv_linux $catostv_params catostv.gpu=nvidia
    initrd $catostv_initrd
}

menuentry "Install with the open-source NVIDIA driver" --id install-open {
    linux $catostv_linux $catostv_params catostv.gpu=open
    initrd $catostv_initrd
}

menuentry "Install with basic graphics" --id install-safe {
    linux $catostv_linux $catostv_params catostv.gpu=safe nomodeset
    initrd $catostv_initrd
}

menuentry "Boot the installed system" --id disk {
    exit
}

if [ "${grub_platform}" == "efi" ]; then
    menuentry "UEFI settings" --id firmware {
        fwsetup
    }
fi
