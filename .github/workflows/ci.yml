# Builds CatosTV and runs its tests on every push.
name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libxcb1-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Stage CatTube
        run: |
          ./scripts/fetch-cattube.sh "$RUNNER_TEMP/catostv-install-root"
          test -x "$RUNNER_TEMP/catostv-install-root/usr/local/bin/cattube"
          test -f "$RUNNER_TEMP/catostv-install-root/usr/local/share/cattube/cattube-osd.lua"
          test -f "$RUNNER_TEMP/catostv-install-root/usr/local/share/cattube/cattube-input.conf"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace --bins
