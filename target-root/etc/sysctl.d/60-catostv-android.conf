# CatosTV: keep process IDs below 65536, like Android itself does.
#
# Android's 32-bit programs store a lock's owner thread in 16 bits. Once
# IDs pass 65535 (Arch allows about 4 million, and Android starts
# processes constantly), a 32-bit process that takes a lock it already
# holds no longer recognises itself as the owner and waits on itself
# forever. On the TV that froze Android's audio driver (no sound, so
# YouTube and other streaming apps stop after a second) and the 32-bit
# app starter (apps like SmartTube no longer opened). IDs wrap around
# safely below the limit; a TV never needs more. Android has its own
# process-ID namespace with its own limit: android-watch caps that one.
kernel.pid_max = 65535
