# CatosTV performance tuning (adapted from CachyOS)
#
# Limit dirty memory bytes to prevent large write-burst stalls on slow
# SATA, USB, and eMMC storage. Standard percentage-based ratios can build up
# gigabytes of dirty pages on typical systems before flushing at once, stalling
# the compositor and audio.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
