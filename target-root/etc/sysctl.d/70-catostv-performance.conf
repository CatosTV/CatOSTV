# CatosTV performance tuning (adapted from CachyOS)
#
# Limit dirty memory bytes to prevent large write-burst stalls on slow
# SATA, USB, and eMMC storage. Standard percentage-based ratios can build up
# gigabytes of dirty pages on typical systems before flushing at once, stalling
# the compositor and audio.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# Retain directory and inode objects in VFS cache longer (default 100).
# Keeps app discovery, media thumbnails, and library browsing fast.
vm.vfs_cache_pressure = 50

# Do not put threads to sleep that take split locks (compatibility layers and
# games do; by default the kernel stalls them for 10 ms each time). This is a
# sysctl: `split_lock_mitigate=0` on the kernel command line does nothing.
# The leading "-" ignores CPUs without split lock detection.
-kernel.split_lock_mitigate = 0
