# CatosTV runtime and state directories (see tmpfiles.d(5)).
# /run/catostv: world-readable status files written by root services
#   (android-setup.state). /var/lib/catostv: downloads kept across reboots.
d /run/catostv      0755 root root -
# The Debug page's new password, staged for catostv-debug-password.service
# (private to the TV account; root reads it once and deletes it).
d /run/catostv/debug 0700 catostv catostv -
d /var/lib/catostv  0755 root root -
