# CatosTV: ZRAM compressed swap in RAM (from CachyOS).
#
# A compressed block device in RAM used as swap: no swap partition and no
# flash wear. With zstd typical memory compresses two to three times, which
# stretches RAM on small boxes running Android next to the shell.
#
# zram-size is the capacity before compression: as much as RAM, at most 8 GB
# (more would only hold pages that are not worth keeping). zram-resident-limit
# caps what the compressed data itself may take, 3/4 of RAM. Data that does not
# compress (video, Android graphics buffers) frees no memory when it is swapped
# out, so without a limit a full device could crowd out everything else.
# Both are in MiB, ram is the machine's RAM.
[zram0]
compression-algorithm = zstd
zram-size = min(ram, 8192)
zram-resident-limit = ram * 3 / 4
swap-priority = 100
fs-type = swap
