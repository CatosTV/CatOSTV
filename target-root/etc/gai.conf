# CatosTV: prefer IPv4 when a name has both IPv4 and IPv6 addresses
# Many home routers hand out an IPv6 DNS server
# while the IPv6 internet is not reachable; apps then tried IPv6 first and
# showed "network error". IPv4 first is harmless where IPv6 works too.
# Flatpak apps see this file as well. glibc's default table, with IPv4
# (::ffff:0:0/96) moved to the top:
precedence  ::1/128       50
precedence  ::/0          40
precedence  2002::/16     30
precedence ::/96          20
precedence ::ffff:0:0/96  100
