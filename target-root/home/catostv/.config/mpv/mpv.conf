# CatosTV: mpv for a TV, 4K, HDR10 / HLG and Dolby Vision (profiles 5 and 8,
# reshaped by libplacebo), 10-bit HEVC / AV1 / VP9 with hardware decoding.
#
# * vo=gpu-next (libplacebo) is the renderer that handles HDR and Dolby
#   Vision correctly.
# * With Settings → Display → HDR on (and an HDR-capable TV), the compositor
#   runs in HDR and mpv passes the video's HDR metadata through
#   (target-colorspace-hint). Otherwise mpv tone-maps HDR to SDR so it still
#   looks right.
vo=gpu-next
hwdec=auto-safe
target-colorspace-hint=yes
tone-mapping=auto
hdr-compute-peak=auto
# Time video by the audio clock. display-resample has to finish every
# frame before the next screen refresh, and a 4K Dolby Vision frame takes
# the UHD 630 about 20 ms, longer than a 60 Hz refresh: a fifth of the
# frames were dropped.
video-sync=audio
# Dither to 8 bits, the most that reaches the TV at 4K 60 Hz on common
# hardware (a DP link or an HDMI 2.0 port has no room for 10-bit RGB
# there). With HDR on, mpv's own guess is the 10-bit screen buffer, and
# the link then cut each colour to 8 bits without dithering: gradients
# showed bands. On a real 10-bit link 8-bit dither at 4K looks the same.
dither-depth=8
interpolation=no

fullscreen=yes
keep-open=no
save-position-on-quit=yes
osd-font='Inter'
osd-font-size=42
sub-font='Inter'
sub-font-size=46

# Bitstream (passthrough) of Dolby Digital / DTS / TrueHD / Atmos to an AV
# receiver over HDMI. Off by default: when the receiver cannot decode them
# there is no sound at all. Uncomment to try.
#audio-spdif=ac3,eac3,dts,dts-hd,truehd
