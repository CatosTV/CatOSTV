# CatosTV: remote-friendly keys for the Catfyn player (mpv).
# Loaded with --input-conf by the shell; replaces mpv's
# defaults for these keys only. OK, the arrows and Back are taken over by
# the control bar script (catfyn-osd.lua: OK shows the controls, OK again
# pauses, Left/Right scrub while the bar is hidden); the entries below are
# the fallback if that script fails to load.
#
#   Options (F2 / Menu)    subtitle menu  ·  F10 / m: audio-track menu
#   Play/Pause, Next/Prev  media keys
#   Back (Esc / Backspace) stop (the position is reported to the server)
ENTER        cycle pause; show-text "${?pause==yes:Paused}${?pause==no:Playing}" 1200
KP_ENTER     cycle pause; show-text "${?pause==yes:Paused}${?pause==no:Playing}" 1200
SPACE        cycle pause; show-text "${?pause==yes:Paused}${?pause==no:Playing}" 1200
PLAYPAUSE    cycle pause; show-text "${?pause==yes:Paused}${?pause==no:Playing}" 1200
PLAY         set pause no
PAUSE        set pause yes
LEFT         seek -10; show-progress
RIGHT        seek 10; show-progress
UP           seek 60; show-progress
DOWN         seek -60; show-progress
REWIND       seek -30; show-progress
FORWARD      seek 30; show-progress
NEXT         seek 90; show-progress
PREV         seek -90; show-progress
# Menus come from mpv's select.lua (mpv ≥ 0.39): a list you move through
# with Up/Down and pick with Enter; Esc closes it.
F2           script-binding select/select-sid
MENU         script-binding select/select-sid
F10          script-binding select/select-aid
m            script-binding select/select-aid
i            show-progress
ESC          quit
BS           quit
STOP         quit
# Keep mouse clicks from taking the video out of full screen.
MBTN_LEFT_DBL ignore
