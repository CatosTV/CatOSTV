# CatosTV: steady HDMI / DisplayPort audio (crackling
# on the OptiPlex's DP→HDMI output). WirePlumber 0.5 syntax.
#  * bigger ALSA periods and headroom: the Intel HDMI codec underruns with
#    PipeWire's small default batches while the GPU is busy (4K UI, video);
#  * never suspend the HDMI sink: resuming it costs a click and the first
#    fraction of a second of every sound.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.headroom = 8192
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
